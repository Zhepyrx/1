name: Daily bounty triage

on:
  schedule:
    # 13:00 UTC daily (~8am ET / 5am PT)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Restore state DB
        uses: actions/cache@v4
        with:
          path: state.db
          key: bounty-triage-state-v1-${{ github.run_id }}
          restore-keys: |
            bounty-triage-state-v1-

      - name: Run triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          SKILLS: ${{ vars.SKILLS || 'typescript,javascript,python' }}
          MIN_BOUNTY_USD: ${{ vars.MIN_BOUNTY_USD || '50' }}
          MAX_DRAFTS_PER_RUN: ${{ vars.MAX_DRAFTS_PER_RUN || '10' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm run dev -- run

      - name: Commit report
        run: |
          git config user.name "bounty-triage-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "report: $(date -u +%Y-%m-%d)"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
